[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arete-particle-sliders"
version = "0.1.0"
description = "NousResearch Arete Qwen3.5 bindings to the shared ParticleGAN slider lifecycle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@c13890f8e2a1ecf1dc8eb9f2a37f9187cb9fea78#subdirectory=packages/particle-sliders-core",
  "hndl==0.10.0",
  "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
  "transformers==5.15.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1", "safetensors>=0.4,<1"]

[project.entry-points."particle_sliders.response_backends"]
arete-particle-sliders = "arete_particle_sliders.binding:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
arete-particle-sliders = "arete_particle_sliders.binding:INFERENCE"

[project.entry-points."particle_sliders.training_profiles"]
arete-cpu-fixture = "arete_particle_sliders.training_profile:TRAINING_PROFILE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arete_particle_sliders = ["*.json", "*.hndl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
