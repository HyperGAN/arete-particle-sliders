[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arete-native-particle-sliders"
version = "0.1.0"
description = "Distinct full native Arete27B current engine/explicit-placement/RAW cohort"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ec1161f5d74481be3540cb0dfa63d0e8f8b54e90#subdirectory=packages/particle-sliders-core",
  "transformers==5.15.0",
  "accelerate==1.15.0",
  "safetensors>=0.4,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
arete-native-slider = "arete_native.cli:main"

[project.entry-points."particle_sliders.response_backends"]
arete_native = "arete_native.lifecycle:TRAINING"

[project.entry-points."particle_sliders.inference_backends"]
arete_native = "arete_native.lifecycle:INFERENCE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arete_native = ["model.lock.json", "current_core.json", "host-source.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
